name: Agent Bourse PEA

on:
  schedule:
    # Exécution du lundi au vendredi à 15h45 UTC (soit 17h45 heure de Paris en été)
    - cron: '45 15 * * 1-5'
  workflow_dispatch: # Permet de lancer le script manuellement depuis GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install yfinance pandas requests

      - name: Exécuter le script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nom_de_votre_fichier.py
